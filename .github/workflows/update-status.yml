name: Update Server Status

on:
  workflow_dispatch:   # apenas manual — atualização automática feita pelo servidor via cron

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 20.94.160.24 >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "Chave carregada: $(head -1 ~/.ssh/id_rsa)"
          echo "Linhas na chave: $(wc -l < ~/.ssh/id_rsa)"

      - name: Gerar status.js via servidor
        run: |
          ssh -i ~/.ssh/id_rsa \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=20 \
              vinicius-argo@20.94.160.24 \
              "python3 /home/vinicius-argo/generate_map_status.py" \
            | python3 .github/scripts/json_to_status_js.py - > status.js

      - name: Commit e push (somente se mudou)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status.js
          git diff --staged --quiet && echo "Sem mudanças" && exit 0
          git commit -m "auto: status $(date -u '+%d/%m/%Y %H:%M') UTC"
          git push
